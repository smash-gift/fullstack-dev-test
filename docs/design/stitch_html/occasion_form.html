<body class="min-h-screen md:pb-0 font-body-md text-body-md flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-surface-dark border-b border-border-accent fixed top-0 left-0 right-0">

<a class="font-body-md text-body-md text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform" href="#">Editor</a>

<form class="flex flex-col h-full">
<!-- Section 1 -->
<div class="mb-10 relative z-10">
<label class="block font-headline-md text-headline-md text-inverse-surface mb-4 font-bold">1. Choose the Occasion</label>
<div class="flex flex-wrap gap-3">
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface active font-bold">🎂 Birthday</div>
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">💍 Wedding</div>
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">🎓 Graduation</div>
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">❤️ Love/Dating</div>

</div>
</div>

<label class="block font-headline-md text-headline-md text-inverse-surface mb-4 font-bold">2. Who is this card for?</label>
<div class="flex flex-wrap gap-3">
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">Best Friend</div>
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">Mother</div>
<div class="chip border border-surface-container-highest rounded-full px-4 py-2 font-body-md text-body-md text-on-surface font-bold">Father</div>

<script>
        // Simple script to handle chip selection for demo purposes
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                // Find parent container
                const container = this.closest('.flex-wrap');
                // Remove active class from all chips in this container
                container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                // Add active class to clicked chip
                this.classList.add('active');
            });
        });
    </script>
