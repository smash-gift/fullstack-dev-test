org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler cache fails with "this and base files have different roots" when
# the project directory and the pub cache live on different Windows drive letters (here: repo on
# D:, pub cache on C:) — a known upstream Kotlin/Gradle path-relativization bug on Windows, not
# specific to any plugin. Disabling incremental compilation works around it. Found while verifying
# the google_sign_in v7 migration fix (`flutter build apk --debug` failed here, unrelated to that
# fix — see docs/specs/2026-08-12-mobile-technical-design.md, rodada 5, and the mobile-agent
# handoff for that task). Flagged to the orchestrator as a build-environment decision, not a
# product/architecture one.
kotlin.incremental=false
